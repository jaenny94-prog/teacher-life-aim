<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>티처 머니 & 라이프 대시보드</title>
    
    <!-- PWA 및 모바일 필수 메타 태그 -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="티처라이프" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='128' fill='%234f46e5'/%3E%3Cpath d='M256 120 L380 200 L256 280 L132 200 Z' fill='%23ffffff'/%3E%3Cpath d='M160 230 L160 320 C160 360 352 360 352 320 L352 230' fill='none' stroke='%23ffffff' stroke-width='28' stroke-linecap='round'/%3E%3Cpath d='M380 200 L380 300' stroke='%23ffffff' stroke-width='20' stroke-linecap='round'/%3E%3C/svg%3E" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 text-slate-800">
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>

    <!-- 서비스 워커 즉각 활성화 스크립트 -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then((reg) => {
              console.log('PWA ServiceWorker 등록 완료:', reg.scope);
            })
            .catch((err) => {
              console.warn('PWA ServiceWorker 등록 오류:', err);
            });
        });
      }
    </script>
  </body>
</html>
